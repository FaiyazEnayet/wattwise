[project]
name = "wattwise"
version = "1.2.0"
description = "Home energy analytics for a Long Island house on PSEG: bill forecasting, TOU vs flat comparison, LP load-shifting optimizer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["beautifulsoup4>=4.11", 
    "numpy",
    "pandas",
    "scipy",
    "plotly",
    "matplotlib",
    "pillow",
]

[project.scripts]
wattwise = "wattwise.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
